name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @missing-you/shared build

      - name: Lint web
        run: pnpm --filter @missing-you/web lint

      - name: Test web
        run: pnpm --filter @missing-you/web test:run

      - name: Build web
        run: pnpm --filter @missing-you/web build

  contracts:
    name: Contract tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install Foundry libraries
        working-directory: packages/contracts
        run: |
          forge install foundry-rs/forge-std
          forge install OpenZeppelin/openzeppelin-contracts@v5.1.0

      - name: Run contract tests
        working-directory: packages/contracts
        run: forge test
